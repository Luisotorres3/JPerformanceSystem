name: Review
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm run check:repo
      - run: npm run test:repo
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-results
          path: |
            qa.local/launch-results.json
            qa.local/release/results.json
            qa.local/release/*.png
          retention-days: 14
